name: Build 3DSX + CIA
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install makerom + bannertool
        run: |
          apt-get update && apt-get install -y wget unzip
          wget -q https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.4/makerom-v0.18.4-ubuntu_x86_64.zip -O mr.zip
          unzip -o mr.zip -d /usr/local/bin && chmod +x /usr/local/bin/makerom
          wget -q https://github.com/diasurgical/bannertool/releases/download/1.2.0/bannertool.zip -O bt.zip
          unzip -o bt.zip -d bt && cp bt/linux-x86_64/bannertool /usr/local/bin/ && chmod +x /usr/local/bin/bannertool

      - name: Build
        run: make cia

      - uses: actions/upload-artifact@v4
        with:
          name: NannyDiaries
          path: |
            NannyDiaries.3dsx
            NannyDiaries.cia
